<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imigrante AI - Assistente Virtual</title>
    <style>
        /* =====================================================================
           ESTILO PREMIUM DARK COM CORREÇÃO DE RESPONSIVIDADE (MOBILE READY)
           ===================================================================== */
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --border-color: #21262d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --teal-primary: #008080;
            --teal-glow: #00a3a3;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-stack);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* BARRA DE NAVEGAÇÃO SUPERIOR - FLEXÍVEL PARA MOBILE */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: rgba(22, 27, 34, 0.95);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
        }

        .logo-highlight {
            color: var(--teal-glow);
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 25px;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--teal-glow);
        }

        .nav-links a.nav-btn-ia {
            background-color: var(--teal-primary);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* CONFIGURAÇÃO PARA TELEMÓVEIS (MOBILE FIX) */
        @media (max-width: 768px) {
            .navbar {
                height: auto;
                padding: 12px 15px !important;
                flex-direction: column !important;
                gap: 10px;
            }

            .logo {
                font-size: 1.1rem !important;
            }

            .nav-links {
                width: 100%;
                justify-content: center !important;
                gap: 15px !important;
            }

            .nav-links a {
                margin-left: 0 !important;
                font-size: 0.8rem !important;
            }

            .chat-wrapper-container {
                padding-top: 125px !important; /* Mais espaço para a navbar maior no telemóvel */
            }
            
            .chat-container {
                height: calc(100vh - 140px) !important;
                width: 100% !important;
                border-radius: 0 !important;
                border-left: none;
                border-right: none;
            }
        }

        /* ESTRUTURA CENTRAL DO CHAT */
        .chat-wrapper-container {
            flex: 1;
            padding-top: 90px;
            padding-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #161b22 0%, #0d1117 100%);
        }

        .chat-container {
            width: 92%;
            max-width: 750px;
            background-color: rgba(22, 27, 34, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 130px);
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .chat-header {
            padding: 15px;
            background-color: rgba(22, 27, 34, 0.9);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .chat-header h2 { color: #fff; font-size: 1.2rem; }
        .chat-header p { color: var(--text-muted); font-size: 0.8rem; }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: rgba(13, 17, 23, 0.4);
        }

        /* BALÕES DE MENSAGENS */
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease-in-out;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--teal-primary);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        /* ÁREA DE INPUT */
        .input-area {
            display: flex;
            padding: 15px;
            background-color: rgba(22, 27, 34, 0.9);
            border-top: 1px solid var(--border-color);
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 0.95rem;
        }

        .input-area button {
            background-color: var(--teal-primary);
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">PORTAL<span class="logo-highlight">IMIGRANTE PT</span></div>
        <div class="nav-links">
            <a href="index.html">Notícias ao Vivo</a>
            <a href="#">Guias Regionais</a>
            <a href="assistente.html" class="nav-btn-ia">Assistente IA 🤖</a>
        </div>
    </nav>

    <div class="chat-wrapper-container">
        <div class="chat-container">
            <div class="chat-header">
                <h2>Imigrante AI</h2>
                <p>O teu conselheiro virtual para Portugal</p>
            </div>
            
            <div class="chat-box" id="chatBox">
                </div>
            
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Pergunta-me algo..." autocomplete="off">
                <button onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
