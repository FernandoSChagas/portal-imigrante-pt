<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Mudança - Portal Imigrante PT</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* CSS DE SEGURANÇA: Bloqueia conflitos com o hub.css */
        body { background-color: #0d1117 !important; color: #c9d1d9 !important; font-family: sans-serif !important; }
        
        .sim-wrapper { max-width: 850px !important; margin: 40px auto !important; padding: 0 20px !important; }
        
        .sim-card { 
            background: #161b22 !important; 
            border: 1px solid #21262d !important; 
            border-radius: 16px !important; 
            padding: 40px !important; 
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6) !important;
        }

        .sim-header h1 { color: #00e5ff !important; font-size: 1.9rem !important; margin-bottom: 12px !important; }
        
        .input-group { margin-bottom: 25px !important; }
        .input-group label { display: block !important; margin-bottom: 8px !important; color: #8b949e !important; }

        .select-custom, .input-custom { 
            background: #0d1117 !important; 
            border: 1px solid #30363d !important; 
            color: #fff !important; 
            padding: 12px !important; 
            border-radius: 6px !important; 
            width: 100% !important; 
            box-sizing: border-box !important;
        }

        .btn-calc { 
            background: #008080 !important; 
            color: #fff !important; 
            border: none !important; 
            padding: 15px !important; 
            width: 100% !important; 
            border-radius: 6px !important; 
            cursor: pointer !important;
            font-weight: bold !important;
        }
        
        /* Ajuste simples para o menu não quebrar */
        .navbar { display: flex !important; justify-content: space-between !important; padding: 20px !important; background: #0d1117 !important; }
        .nav-links { display: flex !important; gap: 15px !important; }
        .nav-links a { color: #c9d1d9 !important; text-decoration: none !important; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">PORTAL IMIGRANTE PT</div>
        <div class="nav-links">
            <a href="index.html">Notícias</a>
            <a href="guias.html">Guias</a>
            <a href="simulador.html" style="color:#00e5ff;">Simulador</a>
            <a href="empregos.html">Empregos</a>
        </div>
    </nav>

    <main class="sim-wrapper">
        <div class="sim-card">
            <div class="sim-header">
                <h1>💰 Simulador de Reserva</h1>
                <p>Projete com precisão o capital necessário para a sua transição.</p>
            </div>

            <div id="setupForm">
                <div class="input-group">
                    <label>Perfil Familiar:</label>
                    <select id="perfil" class="select-custom">
                        <option value="solteiro">Solteiro</option>
                        <option value="casal" selected>Casal</option>
                        <option value="familia">Família</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Região de Destino:</label>
                    <select id="regiao" class="select-custom">
                        <option value="Norte de Portugal">Norte de Portugal</option>
                        <option value="Lisboa">Lisboa</option>
                    </select>
                </div>

                <button class="btn-calc" onclick="alert('Funcionalidade carregada!')">Calcular Orçamento</button>
            </div>
        </div>
    </main>

</body>
</html>
