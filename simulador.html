<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador de Mudança - Portal Imigrante PT</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/hub.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* AJUSTES DE RESPONSIVIDADE OTIMIZADOS */
        body { margin: 0; padding: 0; overflow-x: hidden; }
        .sim-wrapper { max-width: 850px; margin: 20px 10px; padding: 0 10px; }
        
        .sim-card { 
            background: #161b22; 
            border: 1px solid #21262d; 
            border-radius: 16px; 
            padding: 20px; /* Reduzido de 40px para telemóvel */
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }
        
        .sim-header h1 { font-size: 1.5rem; } /* Ajuste de título para telemóvel */
        
        .select-custom, .input-custom { padding: 12px 15px; font-size: 16px; /* 16px evita zoom automático no iOS */ }

        .total-box h2 { font-size: 2rem; } /* Ajuste de valores para não quebrar linha */

        /* Garantir que o footer não quebre o layout */
        footer { padding: 20px 10px; }
        .footer-main { flex-direction: column; text-align: center; }

        @media (min-width: 768px) {
            .sim-card { padding: 40px; }
            .sim-header h1 { font-size: 1.9rem; }
            .total-box h2 { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

 <nav class="navbar">
    <div class="logo" style="display: flex; align-items: center; gap: 10px;">
        <img src="favicon.png" alt="Logo" style="height: 28px; width: auto; object-fit: contain;">
        PORTAL<span class="logo-highlight">IMIGRANTE PT</span>
    </div>
    <div class="nav-links">
        <a href="index.html">Notícias ao Vivo</a>
        <a href="guias.html">Guias Regionais</a>
        <a href="simulador.html" class="active">Simulador</a>
        <a href="empregos.html">Vagas de Emprego</a>
        <a href="viver-do-digital.html" style="color: #00e5ff; font-weight: bold; border: 1px dashed rgba(0, 229, 255, 0.4); padding: 5px 10px; border-radius: 4px;">Ganhar em Euro</a>
        <a href="assistente.html" class="nav-btn-ia">Assistente IA</a>
    </div>
</nav>

    <main class="sim-wrapper">
        <div class="sim-card">
            <div class="sim-header">
                <h1>Simulador de Reserva</h1>
                <p>Projete com precisão o capital necessário para a sua transição em 2026.</p>
            </div>

            <div id="setupForm">
                <div class="input-group">
                    <label><i class="fa-solid fa-users" style="color: #00e5ff; margin-right: 6px;"></i> Perfil Familiar:</label>
                    <select id="perfil" class="select-custom">
                        <option value="solteiro">Solteiro</option>
                        <option value="casal" selected>Casal</option>
                        <option value="familia">Família (com 1 filho)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-map-location-dot" style="color: #00e5ff; margin-right: 6px;"></i> Região de Destino:</label>
                    <select id="regiao" class="select-custom">
                        <option value="Norte de Portugal">Norte de Portugal</option>
                        <option value="Centro de Portugal">Centro de Portugal</option>
                        <option value="Lisboa e Vale do Tejo">Região de Lisboa</option>
                        <option value="Alentejo">Alentejo</option>
                        <option value="Algarve">Algarve</option>
                    </select>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-calendar-days" style="color: #00e5ff; margin-right: 6px;"></i> Tempo: <span id="mesesVal" style="color:#00e5ff; font-weight:bold;">6 meses</span></label>
                    <div class="range-container">
                        <input type="range" id="meses" min="3" max="12" value="6" oninput="document.getElementById('mesesVal').innerText = this.value + ' meses'">
                    </div>
                </div>

                <button class="btn-calc" id="btnPrimeiroPasso" onclick="mostrarCapturaLeads()">Calcular Orçamento</button>
            </div>

            <div id="leadForm" class="lead-section">
                </div>
            <div class="results-area" id="resArea">
                </div>
        </div>
    </main>

    <script>
        // Mantém as tuas funções de mostrarCapturaLeads e executarCalculoFinal inalteradas
    </script>
</body>
</html>
